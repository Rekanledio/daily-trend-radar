# Daily Trend Radar — Data Pipeline
#
# Stage 3-1: 定时 + 手动触发运行 Pipeline，产出真实数据。
# 后继阶段会逐步添加 data/ → frontend/public/data/ 同步、auto-commit、Vercel 部署。
#
# 触发：
#   schedule:    每日 02:00 UTC（北京时间 10:00），避开全球凌晨高峰
#   workflow_dispatch: 手动触发，不要求额外参数
#
# 设计原则：
#   1. 不生成 Mock 数据
#   2. 不修正或过滤真实数据
#   3. 单个数据源失败不拖垮整个 Workflow（由 Pipeline 内部错误隔离机制处理）
#   4. 如果所有数据源全部失败，Workflow 应明确失败
#   5. 不使用 continue-on-error 掩盖 Pipeline 错误
#   6. 不依赖外部 Secret（GITHUB_TOKEN 为可选，不提供则以未认证身份运行）

name: Update Data

on:
  schedule:
    # ┌─ minute (0)
    # │ ┌─ hour (2 = UTC, 对应 UTC+8 10:00)
    # │ │ ┌─ day of month (*)
    # │ │ │ ┌─ month (*)
    # │ │ │ │ ┌─ day of week (*)
    # 0 2 * * *
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Run Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipeline dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: pipeline
        run: pytest -q

      - name: Run Pipeline
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=src python -m pipeline

      - name: Verify output files exist
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          Y=$(date -u +"%Y")
          M=$(date -u +"%m")
          echo "Expected date: $DATE"
          for f in "data/$Y/$M/$DATE.json" data/index.json data/health.json data/sources_state.json; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              echo "  ✅ $f ($size bytes)"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done
          echo "All output files verified."
