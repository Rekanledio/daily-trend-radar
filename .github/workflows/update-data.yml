# Daily Trend Radar — Data Pipeline
#
# Stage 3-1: 定时 + 手动触发运行 Pipeline，产出真实数据。
# Stage 3-2: 运行 Pipeline 前先恢复 Git 跟踪的历史数据到 data/，
#            确保 Pipeline 的 update_index() 能读取已有 index.json 并保留历史日期，
#            然后自动同步 data/ → frontend/public/data/（供 Vercel 部署读取）。
# Stage 3-3: 自动 git add / commit / push 同步后的数据。
#
# 触发：
#   schedule:    每日 02:00 UTC（北京时间 10:00），避开全球凌晨高峰
#   workflow_dispatch: 手动触发，不要求额外参数
#
# 防循环机制：commit message 包含 [skip ci]，GitHub 不会因 push 事件
# 重新触发本 workflow（GitHub 内置规则）。
#
# 历史数据持久化：
#   data/ 目录被 .gitignore 忽略，但 frontend/public/data/ 是 Git 跟踪的
#   部署目录。每次运行前将 frontend/public/data/ 恢复到 data/，确保历史
#   日期的 shard 文件和 index 数据被 Pipeline 继承，不会因增量写入而丢失。
#   （参见诊断报告 P1 问题修复方案）
#
# 设计原则：
#   1. 不生成 Mock 数据
#   2. 不修正或过滤真实数据
#   3. 单个数据源失败不拖垮整个 Workflow（由 Pipeline 内部错误隔离机制处理）
#   4. 如果所有数据源全部失败，Workflow 应明确失败
#   5. 不使用 continue-on-error 掩盖 Pipeline 错误
#   6. 不依赖外部 Secret（GITHUB_TOKEN 为可选，不提供则以未认证身份运行）

name: Update Data

on:
  schedule:
    # ┌─ minute (0)
    # │ ┌─ hour (2 = UTC, 对应 UTC+8 10:00)
    # │ │ ┌─ day of month (*)
    # │ │ │ ┌─ month (*)
    # │ │ │ │ ┌─ day of week (*)
    # 0 2 * * *
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Run Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore historical data for Pipeline
        run: |
          # Restore git-tracked frontend/public/data/ → data/ so the Pipeline
          # can read existing index.json (preserving historical date_index and
          # available_dates) and keep past shard files intact.
          # Without this step, the Pipeline starts with an empty data/ directory
          # (gitignored) and only writes the current day, losing history.
          if [ -d frontend/public/data ]; then
            mkdir -p data
            cp -r frontend/public/data/* data/
            echo "Restored $(find data -type f | wc -l) historical files to data/"
          else
            echo "No historical data to restore (first run)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipeline dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: pipeline
        run: pytest -q

      - name: Run Pipeline
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=src python -m pipeline

      - name: Verify output files exist
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          Y=$(date -u +"%Y")
          M=$(date -u +"%m")
          echo "Expected date: $DATE"
          for f in "data/$Y/$M/$DATE.json" data/index.json data/health.json data/sources_state.json; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              echo "  ✅ $f ($size bytes)"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done
          echo "All output files verified."

      - name: Sync generated data to frontend public directory
        run: |
          # data/ now contains historical shards (restored pre-Pipeline) + new
          # shard (generated by Pipeline), so cp -r captures everything.
          echo "Cleaning old frontend/public/data/..."
          rm -rf frontend/public/data/
          mkdir -p frontend/public/data
          echo "Copying data/* → frontend/public/data/ ..."
          cp -r data/* frontend/public/data/
          echo "Sync complete."

      - name: Verify synced data files
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          Y=$(date -u +"%Y")
          M=$(date -u +"%m")
          echo "Expected date: $DATE"
          for f in "frontend/public/data/$Y/$M/$DATE.json" frontend/public/data/index.json frontend/public/data/health.json frontend/public/data/sources_state.json; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              echo "  ✅ $f ($size bytes)"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done
          echo "All synced data files verified."

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage data changes
        run: git add frontend/public/data

      - name: Commit data changes (if any)
        run: |
          if git diff --cached --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): update generated data [skip ci]"
            echo "Committed data changes."
          fi

      - name: Push to master
        run: git push origin master
