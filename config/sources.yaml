# =============================================================================
# Daily Trend Radar — 统一数据源配置（静态配置）
# -----------------------------------------------------------------------------
# 权威说明：PROJECT_RULES.md 第五部分 / ARCHITECTURE_REVIEW_v2.md 第 5 节
#
# 设计原则（两分离）：
#   - 本文件为「静态配置」：人写、进仓库、版本化。描述“这个源是什么、怎么采、合不合规”。
#   - 运行态（data/sources_state.json）由机器每次运行写入：描述“这个源最近跑得怎么样”。
#   两者必须分离；新增/关闭源只改本文件，不动核心业务逻辑。
#
# 当前状态：仅定义统一配置结构，尚未配置任何真实数据源。
#   —— 不配置未经确认的真实 URL，待数据源评估通过后再填入。
# =============================================================================

version: 1

# 全局默认值（可被单个源覆盖）
defaults:
  timeout: 15        # 请求超时（秒）
  retry_count: 2     # 失败重试次数
  rate_limit: "1/5s" # 访问频率（每 5 秒 1 次）
  max_items: 20      # 单源最大条目数（上限 20，与每板块 ≤20 红线一致）

# 数据源列表
# -----------------------------------------------------------------------------
# 接入规则（PROJECT_RULES 第十七部分）：只有通过合规评估、legal_status 合法的
# 数据源才开发 Adapter。现已评估并通过：ArXiv（官方 Atom API，遵守 3s 间隔）。
# 其余源（GitHub / AI 官方 RSS / 科技 RSS）尚未实现 Adapter，保持关闭/未配置。
sources:
  # —— 首个真实源（Stage 1-3A）——
  # 评估：官方 API（Atom），legal_status=official_api；遵守 robots/ToU；
  # 频率 1/3s（ArXiv 要求 ≥3s 间隔）；original_url 真实可追溯。
  - id: arxiv
    name: "arXiv"
    category: ai_research          # 见 v2 第 5 节（PROJECT_PLAN 旧写 ai，以 v2 的 ai_research 为准）
    type: api                     # 官方接口
    enabled: true
    priority: 1                   # 数字越小越权威
    max_items: 20                 # ≤20，与每板块红线一致
    timeout: 20                   # 覆盖 defaults.timeout
    retry_count: 2
    rate_limit: "1/3s"           # 遵守 ArXiv 3 秒间隔
    legal_status: official_api
    terms_url: "https://arxiv.org/help/api/tou"
    endpoint: "http://export.arxiv.org/api/query"
    query: "cat:cs.AI OR cat:cs.CL OR cat:cs.LG"   # MVP 最小可维护分类集（见 v2 第 5/12 节）
    allowed_domains:              # original_url 仅允许落在 arxiv.org（含 export.arxiv.org）
      - "arxiv.org"
    notes: "官方 Atom API；按 submittedDate 倒序取最新；分页 max_results=20/页。"
#
# —— 第二个真实源（Stage 1-3B，Adapter 已实现，默认关闭）——
# 评估：GitHub 官方 Search Repositories API（official_api），遵守速率限制；
#   未认证 10 次/分钟，带 GITHUB_TOKEN 30 次/分钟；original_url 真实可追溯。
#   默认 enabled: false —— 本阶段只实现 Adapter，不接入生产数据。
#   Adapter 内部追加 sort=stars&order=desc；allowed_domains 仅 github.com。
  - id: github
    name: "GitHub"
    category: opensource            # 见 sources.yaml 示例结构（opensource 等）
    type: api                       # 官方接口
    enabled: false                  # 默认关闭，待人工审查后开启
    priority: 2                     # 次于 arXiv 官方研究源
    max_items: 20                   # ≤20，与每板块红线一致
    timeout: 15
    retry_count: 2
    rate_limit: "1/6s"             # 未认证 10 次/分钟（60/10=6s），保守合规
    legal_status: official_api
    terms_url: "https://docs.github.com/en/site-policy/github-acceptable-use-policies/github-api-terms-of-service"
    endpoint: "https://api.github.com/search/repositories"
    query: "stars:>1000 pushed:>2026-06-24"   # 近 30 天、按 stars 降序（sort/order 由 Adapter 追加）
    allowed_domains:
      - "github.com"                # html_url 恒为 github.com；api.github.com 仅作 endpoint，不入 allowed
#
# —— 第三个真实源（Stage 1-3C，通用 RSSAdapter，默认关闭）——
# 评估：OpenAI 官方博客 RSS（official_rss），公开、无需鉴权、零反爬风险。
#   endpoint 引自 ARCHITECTURE_REVIEW_v2.md:232 的规划配置（项目内权威来源）。
#   默认 enabled: false —— 本阶段只实现 Adapter，不接入生产数据；
#   真实 RSS 冒烟与启用需待人工确认 URL 可用后再行。
#   allowed_domains 仅 openai.com（endpoint host 即 openai.com，无需额外放宽）。
#   科技媒体 RSS 源未添加：项目文档/配置中无其权威 Feed URL（PROJECT_RULES 红线
#   禁止伪造/猜测 URL），待人工确认后仅需在此追加一段 SourceConfig。
  - id: openai_blog
    name: "OpenAI Blog"
    category: ai_official          # 见 sources.yaml 示例结构（ai_official 等）
    type: rss                      # 官方 RSS
    enabled: false                 # 默认关闭，待真实冒烟与人工审查后开启
    priority: 2                     # 次于 arXiv 官方研究源
    max_items: 20                   # ≤20，与每板块红线一致
    timeout: 15
    retry_count: 2
    rate_limit: "1/5s"            # 保守合规，单源低频
    legal_status: official_rss
    endpoint: "https://openai.com/blog/rss.xml"   # 引自 ARCHITECTURE_REVIEW_v2.md:232
    allowed_domains:
      - "openai.com"              # 真实文章页恒为 openai.com
#
# 单个数据源字段说明（示例，非真实配置，仅用于说明结构）：
#   - id: example-source            # 唯一标识（字母/数字/下划线）
#     name: "示例源"                # 展示名
#     category: ai_research         # 分类：ai_research | opensource | ai_official | tech_news | social | game
#     type: api                     # 类型：api | rss | page
#     enabled: false                # 是否启用
#     priority: 1                   # 优先级（数字越小越权威）
#     max_items: 20                 # 覆盖 defaults.max_items
#     timeout: 20                   # 覆盖 defaults.timeout
#     retry_count: 2
#     rate_limit: "1/3s"
#     legal_status: official_api    # official_api | official_rss | public_page | third_party_legal | manual
#     terms_url: "https://example.com/terms"        # 服务条款/使用条款链接
#     endpoint: "https://example.com/feed.xml"      # 采集端点（仅示例占位，非真实源）
