[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-trend-radar-pipeline"
version = "0.2.0"
description = "Data collection and processing pipeline for Daily Trend Radar"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
